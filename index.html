<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Danh Sách Liên Kết</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    :root{
        --bg-0:#0c0e14;
        --bg-1:#12141c;
        --grid-dot: rgba(148,163,184,0.14);
        --panel: rgba(255,255,255,0.04);
        --panel-border: rgba(255,255,255,0.09);
        --dotnet-purple:#8b5cf6;
        --dotnet-purple-deep:#512bd4;
        --trello-blue:#0079bf;
        --text-hi:#eef1f7;
        --text-lo:#8b93a7;
        --mono: 'JetBrains Mono', 'Consolas', monospace;
        --sans: 'Inter', 'Segoe UI', Tahoma, sans-serif;
    }
    *{ box-sizing:border-box; margin:0; padding:0; }
    body{
        min-height:100vh;
        font-family: var(--sans);
        color: var(--text-hi);
        display:flex; justify-content:center; align-items:center;
        padding: 28px 16px;
        background:
            radial-gradient(circle at 50% 0%, rgba(139,92,246,0.16), transparent 55%),
            radial-gradient(circle at 85% 90%, rgba(56,189,248,0.10), transparent 45%),
            linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 100%);
        background-attachment: fixed;
        position: relative;
        overflow-x:hidden;
    }
    /* Form-designer dot grid, like the WinForms canvas */
    body::before{
        content:"";
        position:fixed; inset:0;
        background-image: radial-gradient(var(--grid-dot) 1.4px, transparent 1.4px);
        background-size: 26px 26px;
        background-position: -4px -4px;
        pointer-events:none;
        mask-image: radial-gradient(ellipse 80% 70% at 50% 30%, #000 40%, transparent 90%);
    }

    .frame{
        width:100%; max-width: 480px;
        border-radius: 14px;
        overflow:hidden;
        background: var(--panel);
        border: 1px solid var(--panel-border);
        box-shadow: 0 30px 70px -20px rgba(0,0,0,0.65), 0 0 0 1px rgba(255,255,255,0.02);
        backdrop-filter: blur(14px);
        animation: rise 0.6s cubic-bezier(.2,.8,.2,1) both;
    }
    @keyframes rise{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:none;} }

    /* Title bar — a nod to the Windows/Visual Studio chrome */
    .titlebar{
        display:flex; align-items:center; gap:8px;
        padding: 10px 14px;
        background: linear-gradient(180deg, #1a1d29 0%, #14161f 100%);
        border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .dot{ width:11px; height:11px; border-radius:50%; }
    .dot.r{ background:#ff5f57; } .dot.y{ background:#febc2e; } .dot.g{ background:#28c840; }
    .titlebar-label{
        margin-left: 8px;
        font-family: var(--mono);
        font-size: 0.72rem;
        color: var(--text-lo);
        letter-spacing: 0.3px;
    }

    /* Cover: Form1.cs design surface with a floating WinForms toolbox glyph */
    .cover{
        position:relative;
        height: 148px;
        background:
            linear-gradient(135deg, rgba(139,92,246,0.22), rgba(56,189,248,0.10) 60%, transparent),
            repeating-linear-gradient(0deg, transparent, transparent 23px, rgba(255,255,255,0.05) 23px, rgba(255,255,255,0.05) 24px),
            repeating-linear-gradient(90deg, transparent, transparent 23px, rgba(255,255,255,0.05) 23px, rgba(255,255,255,0.05) 24px),
            #171a24;
        display:flex; align-items:center; justify-content:center;
    }
    .cover svg{ width: 92px; height:92px; filter: drop-shadow(0 10px 18px rgba(139,92,246,0.35)); }
    .cover .tag{
        position:absolute; top:12px; left:14px;
        font-family:var(--mono); font-size:0.66rem; color: var(--dotnet-purple);
        background: rgba(139,92,246,0.14); border:1px solid rgba(139,92,246,0.35);
        padding:3px 8px; border-radius:6px; letter-spacing:0.4px;
    }
    .cover .tag2{
        position:absolute; bottom:12px; right:14px;
        font-family:var(--mono); font-size:0.66rem; color:#38bdf8;
        background: rgba(56,189,248,0.10); border:1px solid rgba(56,189,248,0.3);
        padding:3px 8px; border-radius:6px; letter-spacing:0.4px;
    }

    .content{ padding: 26px 26px 24px; text-align:center; }

    .avatar{
        width:64px; height:64px; border-radius: 14px;
        margin: -46px auto 14px;
        display:flex; align-items:center; justify-content:center;
        font-family: var(--mono); font-weight:800; font-size:1.05rem;
        color:#fff;
        background: linear-gradient(145deg, var(--dotnet-purple) 0%, var(--dotnet-purple-deep) 100%);
        border: 3px solid var(--bg-1);
        box-shadow: 0 8px 20px rgba(81,43,212,0.45);
    }

    h1{
        font-family: var(--mono);
        font-size: 1.28rem; font-weight:800;
        letter-spacing: 0.2px;
        margin-bottom:6px;
    }
    h1 .accent{ color: var(--dotnet-purple); }

    .bio{
        color: var(--text-lo);
        font-size: 0.9rem;
        margin-bottom: 22px;
    }

    .links-container{ display:flex; flex-direction:column; gap:14px; }

    /* Link card styled like a raised WinForms Button control */
    .link-card{
        position:relative;
        display:flex; align-items:center; gap:12px;
        padding: 15px 18px;
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.10);
        border-radius: 8px;
        color:#fff; text-decoration:none;
        font-weight:600; font-size:0.95rem;
        text-align:left;
        transition: all 0.22s ease;
    }
    .link-card .ico{
        flex-shrink:0; width:34px; height:34px; border-radius:7px;
        display:flex; align-items:center; justify-content:center;
        font-size:1.05rem;
        background: rgba(255,255,255,0.06);
    }
    .link-card small{ display:block; font-weight:400; font-size:0.76rem; color: var(--text-lo); margin-top:2px; }

    .link-card:hover{
        transform: translateY(-2px);
        background: rgba(255,255,255,0.07);
        border-color: rgba(255,255,255,0.2);
    }
    .link-card:active{ transform: translateY(0); }

    .link-card.trello{
        background: linear-gradient(135deg, rgba(0,121,191,0.28), rgba(0,121,191,0.10));
        border-color: rgba(0,121,191,0.55);
    }
    .link-card.trello .ico{ background: rgba(0,121,191,0.35); }
    .link-card.trello:hover{
        border-color:#38bdf8;
        box-shadow: 0 10px 26px -8px rgba(0,121,191,0.55);
    }

    footer{
        margin-top: 22px;
        font-size: 0.76rem;
        color: var(--text-lo);
        line-height:1.5;
        font-family: var(--mono);
    }
    footer .who{ color:#c3c9d9; }

    @media (prefers-reduced-motion: reduce){
        .frame{ animation:none; }
        .link-card{ transition:none; }
    }
</style>
</head>
<body>

    <div class="frame">
        <div class="titlebar">
            <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
            <span class="titlebar-label">Form1.cs — QuanLyDiem.sln</span>
        </div>

        <div class="cover">
            <span class="tag">C#/.NET</span>
            <span class="tag2">WinForms</span>
            <!-- Simple monitor/app-window glyph -->
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <rect x="8" y="14" width="84" height="60" rx="6" fill="#1f2330" stroke="#8b5cf6" stroke-width="2.5"/>
                <rect x="8" y="14" width="84" height="14" rx="6" fill="#8b5cf6"/>
                <circle cx="16" cy="21" r="2.2" fill="#0c0e14"/>
                <circle cx="23" cy="21" r="2.2" fill="#0c0e14"/>
                <circle cx="30" cy="21" r="2.2" fill="#0c0e14"/>
                <rect x="16" y="36" width="30" height="8" rx="2" fill="#38bdf8"/>
                <rect x="16" y="48" width="46" height="6" rx="2" fill="#3a4155"/>
                <rect x="16" y="58" width="34" height="6" rx="2" fill="#3a4155"/>
                <rect x="68" y="36" width="16" height="28" rx="3" fill="#512bd4"/>
                <rect x="30" y="82" width="40" height="6" rx="3" fill="#3a4155"/>
            </svg>
        </div>

        <div class="content">
            

            <h1>Dự Án <span class="accent">WinForms</span></h1>
            <p class="bio">Liên kết tham gia nhóm phát triển</p>

            <div class="links-container">
                <a href="https://trello.com/invite/b/6a92ea233e0df65728b17eb9/ATTI3257b02ae3043d8926c777b13a9be7596D226C67/📘-dự-an-quản-ly-diểm-winforms" target="_blank" class="link-card trello">
                    <span class="ico">📘</span>
                    <span>
                        Trello: Dự án Quản lý điểm WinForms
                        <small>Bấm để tham gia bảng công việc</small>
                    </span>
                </a>
            </div>

            <footer>
                Đường dẫn tham gia vào nhóm dự án trên trello của<br>
                <span class="who">Trần Văn Lượng</span>.
            </footer>
        </div>
    </div>

</body>
</html>
